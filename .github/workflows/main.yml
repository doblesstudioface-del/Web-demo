name: Scanner
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
           python-version: '3.9'
      - run: pip install requests pandas
      - run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: lista-dobles
          path: lista_prospectos.csv
